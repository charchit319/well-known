  <style>
    #fd-popup {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #fd-modal {
      position: relative;
      width: 100%;
      max-width: 500px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #061d15;
      box-sizing: border-box;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
    }

    #fd-modal > img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: cover;
    }

    #fd-content {
      padding: 28px 30px 32px;
      text-align: center;
      box-sizing: border-box;
    }

    #fd-eyebrow {
      margin-bottom: 12px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(247, 237, 220, 0.75);
    }

    #fd-content h2 {
      margin: 0 0 15px;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      line-height: 1.15;
      color: #f7eddc;
    }

    #fd-content p {
      max-width: 400px;
      margin: 0 auto 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(247, 237, 220, 0.9);
    }

    #fd-content .fd-small {
      margin-bottom: 24px;
      font-size: 12px;
      color: rgba(247, 237, 220, 0.6);
    }

    #fd-reserve {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      background: #b88938;
      color: #061d15;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s ease;
    }

    #fd-reserve:hover {
      background: #d4a24f;
    }

    #fd-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 24px;
      line-height: 36px;
      text-align: center;
      cursor: pointer;
    }

    #fd-close:hover {
      background: #fff;
    }

    @media (max-width: 600px) {
      #fd-popup {
        padding: 10px;
      }

      #fd-modal {
        max-height: calc(100vh - 20px);
      }

      #fd-modal > img {
        max-height: 50vh;
      }

      #fd-content {
        padding: 22px 18px 24px;
      }

      #fd-content h2 {
        font-size: 27px;
      }

      #fd-content p {
        font-size: 13px;
      }

      #fd-reserve {
        width: 100%;
      }

      #fd-close {
        top: 8px;
        right: 8px;
      }
    }
  </style>

  <script>
  (function () {
    var popup = document.getElementById("fd-popup");
    var image = document.querySelector("#fd-modal > img");
    var close = document.getElementById("fd-close");

    // Close button
    close.addEventListener("click", function () {
      popup.style.display = "none";
    });

    // Clicking anywhere outside the image closes the popup
    popup.addEventListener("click", function (event) {
      if (event.target !== image) {
        popup.style.display = "none";
      }
    });
  })();
</script>
